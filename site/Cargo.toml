[package]
name = "gdprguardian-site"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Site de Gardien RGPD : page et statistiques en direct, sans cookie ni journal / GDPR Guardian website daemon"
authors = ["Guillaume CLEMENT - Flow Line Intégration"]
readme = "README.md"
publish = false
build = "build.rs"

# Autonome : hors de l'espace de travail du noyau (rust/) / standalone: not part of the core workspace.
[workspace]

# Licences : MIT, Apache-2.0 ou BSD seulement (voir README.md) / MIT, Apache-2.0 or BSD only.
[dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "time", "signal", "macros"] }
hyper = { version = "1.7", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.17", default-features = false, features = ["tokio"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
siphasher = "1.0"
getrandom = "0.4"

[build-dependencies]
brotli = { version = "8", default-features = false, features = ["std"] }
flate2 = "1.1"
serde_json = { version = "1.0.140", features = ["raw_value"] }
siphasher = "1.0"

[dev-dependencies]
brotli = { version = "8", default-features = false, features = ["std"] }
flate2 = "1.1"
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "time", "macros", "io-util", "sync"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
