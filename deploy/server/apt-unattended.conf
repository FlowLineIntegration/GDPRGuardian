// Gardien RGPD · GDPR Guardian : mises à jour automatiques, /etc/apt/apt.conf.d/52gdprguardian-unattended.
// Chaque nuit, la sécurité seulement : les origines du paquet (publication, -security, ESM) ; les autres mises à jour
// (-updates) passent le samedi par gdprguardian-weekly-upgrade, qui ajoute cette origine (apt-weekly.conf).
// Automatic updates. Every night, security only (the package's origins: release, -security, ESM); the other updates
// (-updates) run on Saturday through gdprguardian-weekly-upgrade, which adds that origin (apt-weekly.conf).
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
// Seules les dépendances rendues inutiles par la mise à jour en cours sont retirées / only newly unused ones.
Unattended-Upgrade::Remove-Unused-Dependencies "false";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
// Redémarrage aussitôt la mise à jour faite quand elle l'exige (noyau, bibliothèque C) ; Docker relance le conteneur.
// Reboot right after the update when it requires one (kernel, C library); Docker restarts the container.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "now";
Unattended-Upgrade::SyslogEnable "true";
Dpkg::Options { "--force-confdef"; "--force-confold"; };
// Heures fixes, fixées par les minuteries (apt-daily*.timer.conf) : aucune attente aléatoire en plus.
// Fixed times, set by the timers: no extra random wait.
APT::Periodic::RandomSleep "0";
