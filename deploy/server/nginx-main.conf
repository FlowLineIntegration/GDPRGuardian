# Gardien RGPD · GDPR Guardian : configuration principale de Nginx, /etc/nginx/nginx-gdprguardian.conf.
# Main Nginx configuration.
#
# Lue grâce au complément systemd nginx.service.d/gdprguardian.conf (nginx -c) : le nginx.conf du paquet reste
# intact, si bien que les mises à jour automatiques de Nginx ne bloquent jamais sur un fichier de configuration
# modifié. Elle reprend le nginx.conf d'Ubuntu, avec ce qu'il faut ici : 8 192 connexions par processus (1 500 flux en
# direct du site et 1 500 connexions au service tiennent 6 000 connexions, client et amont, même sur un seul
# processus), aucune version affichée, aucun journal d'accès, TLS 1.2 et 1.3.
# Read through the systemd drop-in nginx.service.d/gdprguardian.conf (nginx -c): the packaged nginx.conf stays
# untouched, so unattended Nginx upgrades never stall on a modified configuration file. It mirrors Ubuntu's
# nginx.conf, plus what this server needs: 8,192 connections per worker (1,500 live streams and 1,500 service
# connections hold 6,000 connections, client and upstream, even on one worker), no version shown, no access log,
# TLS 1.2/1.3.
user www-data;
worker_processes auto;
worker_rlimit_nofile 16384;
pid /run/nginx.pid;
# Hors des server : rien de propre à une requête ; « emerg » quand même / outside servers: nothing request-specific.
error_log /var/log/nginx/error.log emerg;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log off;

    # Jamais sur les réponses du service (gzip_proxied off par défaut : pas de BREACH sur l'API).
    # Never on the service's responses (gzip_proxied off by default: no BREACH on the API).
    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
