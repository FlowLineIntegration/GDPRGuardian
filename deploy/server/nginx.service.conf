# Gardien RGPD · GDPR Guardian : complément systemd de nginx.service,
# /etc/systemd/system/nginx.service.d/gdprguardian.conf. Nginx lit /etc/nginx/nginx-gdprguardian.conf (nginx-main.conf)
# au lieu du nginx.conf du paquet, laissé intact. systemd drop-in for nginx.service: Nginx reads our main
# configuration instead of the packaged nginx.conf, left untouched. Même PID (/run/nginx.pid) : arrêt, rotation des
# journaux et renouvellement du certificat (systemctl reload nginx) restent ceux du paquet. Same PID file: stop,
# log rotation and certificate renewal (systemctl reload nginx) stay the package's.
#
# Jamais en swap : les zones de limites tiennent des adresses (IPv4 entière, /64 IPv6) et ne doivent pas atteindre le
# disque. Never swapped out: the limit zones hold addresses (full IPv4, IPv6 /64) that must not reach the disk.
[Service]
MemorySwapMax=0
ExecStartPre=
ExecStartPre=/usr/sbin/nginx -t -q -c /etc/nginx/nginx-gdprguardian.conf -g 'daemon on; master_process on;'
ExecStart=
ExecStart=/usr/sbin/nginx -c /etc/nginx/nginx-gdprguardian.conf -g 'daemon on; master_process on;'
ExecReload=
ExecReload=/usr/sbin/nginx -c /etc/nginx/nginx-gdprguardian.conf -g 'daemon on; master_process on;' -s reload
