# Gardien RGPD · GDPR Guardian : passage au service (socket Unix du conteneur sans réseau),
# /etc/nginx/snippets/gdprguardian-service-proxy.conf, dans le location / de l'API et le /v1/ des sites.
# Proxying to the service (Unix socket of the network-less container), in the API's location / and the sites' /v1/.
proxy_pass http://unix:/run/gdprguardian/app.sock:;
proxy_http_version 1.1;
# Nom api.* seulement : le service refuse tout autre Host (421) / api.* names only: the service refuses any other.
proxy_set_header Host $gdprguardian_service_host;
proxy_set_header Connection "";
# Adresse du client pour le limiteur du service, écrasant toute valeur reçue du client ; le service la pseudonymise
# aussitôt en mémoire et ne l'écrit nulle part. Client address for the service's limiter, overwriting any value the
# client sent; the service pseudonymises it at once in memory and writes it nowhere.
proxy_set_header X-GG-Client $remote_addr;
proxy_set_header X-GG-IP "";
# Jeton des requêtes du serveur lui-même : jamais transmis depuis le réseau / the server's own token: never from outside.
proxy_set_header X-GG-Local "";
# Une redirection éventuelle du service vise https://, jamais http:// / any service redirect targets https://.
proxy_redirect http:// https://;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cache-Control;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Permissions-Policy;
# Rien sur disque, et flux MCP transmis sans attendre / nothing on disk, MCP streams passed through.
proxy_request_buffering off;
proxy_buffering off;
proxy_max_temp_file_size 0;
# Réponse attendue jusqu'à 600 s après le corps : l'échéance d'un document de 50 Mio (60 s + 1 s par 250 Ko, soit
# 270 s), plus autant d'attente derrière un autre document maximal, plus une marge : le service répond avant (résultat,
# ou 422 à l'échéance), Nginx ne coupe pas un travail légitime. Response awaited up to 600 s after the body: a 50 MiB
# document's deadline (60 s + 1 s per 250 KB, i.e. 270 s), plus as much waiting behind another maximal document, plus
# a margin: the service answers first (result, or 422 at the deadline), Nginx does not cut a legitimate job.
proxy_read_timeout 600s;
proxy_send_timeout 300s;
