# Gardien RGPD · GDPR Guardian : site Nginx avant le certificat (HTTP seul : défi ACME, sinon refus).
# Nginx site before the certificate exists (HTTP only: ACME challenge, everything else refused).
# Remplacé par nginx-site.conf une fois le certificat obtenu / replaced by nginx-site.conf once certified.
# Aucun journal d'accès ; journal d'erreurs au seul niveau « emerg », qui ne cite jamais d'adresse ; server_tokens
# off dans chaque server. No access log; error log at "emerg" only, which never quotes an address; server_tokens off.

# Nom inconnu : connexion fermée sans réponse / unknown name: connection closed without an answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gdprguardian.com api.gardienrgpd.fr gdprguardian.com www.gdprguardian.com gardienrgpd.fr
                www.gardienrgpd.fr;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    client_max_body_size 0;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 444;
    }
}
