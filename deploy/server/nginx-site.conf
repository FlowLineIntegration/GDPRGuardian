# Gardien RGPD · GDPR Guardian : site Nginx final (HTTPS), /etc/nginx/sites-available/gdprguardian.
# Final Nginx site (HTTPS). Pour un autre déploiement, remplacer les noms et le chemin du certificat.
# For another deployment, replace the names and the certificate path.
#
# Aucun journal d'accès ; journal d'erreurs au seul niveau « emerg » sur chaque server, serveurs par défaut compris
# (une poignée de main TLS ratée y est notée avant que le nom soit connu) : dès « crit », nginx écrit l'adresse
# complète du client et la requête. server_tokens off dans chaque server (le nginx.conf du paquet reste intact).
# No access log; error log at "emerg" only in every server block, default servers included: from "crit" on, nginx
# writes the client's full address and the request. server_tokens off in every server (stock nginx.conf untouched).
#
# Service (API REST, MCP, /v1/ des sites pour le cockpit) : public, sans clé. Nginx pose X-GG-Client = $remote_addr,
# en écrasant toute valeur reçue : le service en tire un pseudonyme en mémoire (limites par client) et ne l'écrit
# nulle part. Les en-têtes de sécurité des réponses du service sont posés ici, erreurs de Nginx comprises.
# Service (REST API, MCP, the sites' /v1/ for the cockpit): public, keyless. Nginx sets X-GG-Client = $remote_addr,
# overwriting any received value: the service turns it into an in-memory pseudonym (per-client limits) and writes it
# nowhere. Security headers of the service's responses are set here, Nginx's own errors included.

# Nom inconnu : connexion fermée sans réponse, et poignée de main TLS refusée.
# Unknown name: connection closed without an answer, TLS handshake refused.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    # Nom TLS inconnu : poignée de main refusée. Nom TLS connu mais Host inconnu : connexion fermée (444), jamais
    # la page par défaut de Nginx. Unknown TLS name: handshake refused. Known TLS name but unknown Host: closed.
    ssl_reject_handshake on;
    return 444;
}

# HTTP des noms api.* : défi ACME seulement ; tout le reste est fermé (444), sans redirection : un client
# configuré en http:// enverrait sinon son document en clair à chaque appel. HTTP for the api.* names: ACME
# challenge only; everything else is closed (444), with no redirect, or a client set up with http:// would send its
# document in clear on every call.
server {
    listen 80;
    listen [::]:80;
    server_name api.gdprguardian.com api.gardienrgpd.fr;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    # Aucun contrôle de taille avant le 444 / no size check before the 444.
    client_max_body_size 0;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 444;
    }
}

# HTTP des sites : défi ACME, pages redirigées vers HTTPS ; le service (/v1/, /mcp) fermé (444) sans redirection, comme
# sur api.* : un client configuré en http:// verrait sinon ses appels « marcher » en envoyant chaque document en clair.
# Sites over HTTP: ACME challenge, pages redirected to HTTPS; the service (/v1/, /mcp) closed (444) with no redirect,
# as on api.*: a client set up with http:// would otherwise see its calls "work" while sending each document in clear.
server {
    listen 80;
    listen [::]:80;
    server_name gdprguardian.com www.gdprguardian.com gardienrgpd.fr www.gardienrgpd.fr;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    # Aucun contrôle de taille avant le 444 / no size check before the 444.
    client_max_body_size 0;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location ^~ /v1/ {
        return 444;
    }
    location ^~ /mcp {
        return 444;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Service : API REST et MCP / service: REST API and MCP.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.gdprguardian.com api.gardienrgpd.fr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/gdprguardian/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdprguardian/privkey.pem;

    access_log off;
    # Le journal d'erreurs cite l'adresse et la requête, jeton compris, et son format ne se règle pas : niveau
    # « emerg » seulement, qui n'en cite jamais. The error log quotes the address and the request, token included,
    # and its format cannot be changed: "emerg" only, which never quotes them.
    error_log /var/log/nginx/gdprguardian.error.log emerg;

    # Envois jusqu'à 50 Mio (limite du service) : 51m, soit 50 Mio plus 1 Mio de marge, qui couvre l'enveloppe
    # multipart (64 Kio). Au-delà, 413 ici, sans rien transmettre ; entre les deux, le service refuse lui-même, avec
    # le même message, tout fichier de plus de 50 Mio. Pause de plus de 15 s entre deux lectures : coupé ; durée totale
    # du corps bornée par le service (15 s + taille à 128 Kio/s).
    # Uploads up to 50 MiB (the service's limit): 51m, i.e. 50 MiB plus a 1 MiB margin covering the multipart envelope
    # (64 KiB). Beyond, 413 here, nothing forwarded; in between, the service itself refuses any file over 50 MiB with
    # the same message. A pause over 15 s between two reads is cut; the whole body's duration is bounded by the
    # service (15 s + size at 128 KiB/s).
    client_max_body_size 51m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 15s;
    # Garde grossière du bord ; les vraies limites (coût, concurrence, file, durée des corps) sont dans le service.
    # Coarse edge guard; the real limits (cost, concurrency, queue, body duration) live in the service.
    limit_req zone=gdprguardian_api burst=40 nodelay;
    limit_conn gdprguardian_api_conn 16;
    limit_conn gdprguardian_api_net 48;
    limit_conn gdprguardian_api_total 1500;

    # En-têtes de sécurité sur toute réponse, erreurs de Nginx comprises ; ceux du service sont masqués.
    # Security headers on every response, Nginx's own errors included; the service's copies are hidden.
    include /etc/nginx/snippets/gdprguardian-service-headers.conf;
    error_page 403 = @gdprguardian_cross_site;
    error_page 429 = @gdprguardian_rate_limited;
    error_page 413 = @gdprguardian_too_large;
    error_page 502 503 504 = @gdprguardian_unavailable;

    location / {
        # Page d'un autre site qui ferait travailler ses visiteurs : refusée ici / another site's page: refused here.
        if ($gdprguardian_cross_site) {
            return 403;
        }
        include /etc/nginx/snippets/gdprguardian-service-proxy.conf;
    }
    include /etc/nginx/snippets/gdprguardian-service-errors.conf;
}

# Site : www renvoie à la racine du même domaine / site: www redirects to the bare domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gdprguardian.com www.gardienrgpd.fr;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gdprguardian/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdprguardian/privkey.pem;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 301 https://$gdprguardian_apex$request_uri;
}

# Site : démon Rust gdprguardian-site (socket Unix), français sur gardienrgpd.fr, anglais sur gdprguardian.com ;
# il pose lui-même les en-têtes de sécurité, sans cookie. Seule l'adresse tronquée lui est transmise (X-GG-IP).
# Site: Rust daemon over a Unix socket; it sets the security headers itself, no cookie. Only the truncated address
# is passed to it (X-GG-IP).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gdprguardian.com gardienrgpd.fr;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gdprguardian/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdprguardian/privkey.pem;
    access_log off;
    error_log /var/log/nginx/gdprguardian.error.log emerg;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    limit_req zone=gdprguardian_req burst=40 nodelay;
    limit_conn gdprguardian_conn 20;

    location / {
        proxy_pass http://unix:/run/gdprguardian-site/site.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-GG-IP $gdprguardian_ip;
        proxy_set_header X-GG-Client "";
        proxy_max_temp_file_size 0;
        proxy_read_timeout 15s;
    }
    # Statistiques en direct (Server-Sent Events) : transmises sans tampon, 10 flux par adresse IPv4 ou /64 IPv6,
    # 64 par /24 ou /48 et 1 500 en tout ; le démon clôt chaque flux après 20 à 30 min et le navigateur se reconnecte.
    # Live statistics: unbuffered, at most 10 streams per IPv4 address or IPv6 /64, 64 per /24 or /48 and 1,500 in
    # all; the daemon ends each stream after 20 to 30 min and the browser reconnects.
    location = /api/live {
        limit_conn gdprguardian_conn 20;
        limit_conn gdprguardian_live 10;
        limit_conn gdprguardian_live_net 64;
        limit_conn gdprguardian_live_total 1500;
        proxy_pass http://unix:/run/gdprguardian-site/site.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-GG-IP $gdprguardian_ip;
        proxy_set_header X-GG-Client "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        gzip off;
    }
    # Vidéo de lancement : servie par Nginx, jamais par le démon (il embarque ses fichiers dans son binaire d'un Mo et
    # ne sert pas de plages d'octets) : plages (Range, 206 ; Safari ne lit une vidéo que par plages), ETag, sendfile.
    # Seuls les noms de la liste existent ($gdprguardian_media, nginx-http.conf) ; fichiers copiés de video/out par
    # install.sh site. Mêmes en-têtes de sécurité que le démon, sa CSP comprise (tests/server/test_deploy_config.py
    # les compare) ; la page cite chaque fichier avec son empreinte (?v=…) : un an de cache, jamais pour une erreur.
    # Launch video: served by Nginx, never by the daemon (it embeds its files in its 1 MB binary and serves no byte
    # ranges): ranges (206; Safari reads video by ranges only), ETag, sendfile. Only the listed names exist; files
    # copied from video/out by install.sh site. Same security headers as the daemon, its CSP included (compared by the
    # tests); the page cites every file with its digest (?v=…): a year of caching, never for an error.
    location ^~ /media/ {
        # Page 404 de Nginx, comme pour un fichier de la liste absent du disque (un texte rendu ici prendrait le type
        # de l'extension demandée) / Nginx's own 404 page, as for a listed file missing on disk.
        if ($gdprguardian_media = 0) {
            return 404;
        }
        alias /var/www/gdprguardian-media/;
        types {
            video/mp4 mp4;
            image/png png;
            text/plain txt;
        }
        charset utf-8;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }
    # Cockpit : anonymisation à la volée, même origine (ni CORS ni connect-src externe). /v1/ va au service comme
    # depuis api.* : Host réécrit au nom api (le service n'accepte que ses noms), adresse du client posée, mêmes
    # limites et mêmes en-têtes que l'API. Rien n'est stocké : le résultat ne part que dans la réponse.
    # Cockpit: on-the-fly anonymisation, same origin (no CORS, no external connect-src). /v1/ goes to the service as
    # from api.*: Host rewritten to the api name, client address set, same limits and headers as the API. Nothing is
    # stored: the result only travels in the response.
    location /v1/ {
        # Mêmes limites que l'API (51m : 50 Mio + 1 Mio de marge) / same limits as the API (50 MiB + 1 MiB margin).
        client_max_body_size 51m;
        client_body_timeout 15s;
        limit_req zone=gdprguardian_api burst=40 nodelay;
        limit_conn gdprguardian_api_conn 16;
        limit_conn gdprguardian_api_net 48;
        limit_conn gdprguardian_api_total 1500;
        include /etc/nginx/snippets/gdprguardian-service-headers.conf;
        error_page 403 = @gdprguardian_cross_site;
        error_page 429 = @gdprguardian_rate_limited;
        error_page 413 = @gdprguardian_too_large;
        error_page 502 503 504 = @gdprguardian_unavailable;
        # Seul le cockpit de la même origine appelle /v1/ depuis un navigateur / only the same-origin cockpit.
        if ($gdprguardian_cross_site) {
            return 403;
        }
        include /etc/nginx/snippets/gdprguardian-service-proxy.conf;
    }
    include /etc/nginx/snippets/gdprguardian-service-errors.conf;
}
