# Gardien RGPD · GDPR Guardian : complément systemd de docker.service, /etc/systemd/system/docker.service.d/gdprguardian.conf.
# Le conteneur monte /run/gdprguardian : son tmpfs dédié (run-gdprguardian.mount) est monté avant Docker, à chaque
# démarrage. systemd drop-in for docker.service: the container mounts /run/gdprguardian, so its dedicated tmpfs is
# mounted before Docker, at every boot.
[Unit]
RequiresMountsFor=/run/gdprguardian
