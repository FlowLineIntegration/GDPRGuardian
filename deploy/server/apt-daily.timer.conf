# Gardien RGPD · GDPR Guardian : /etc/systemd/system/apt-daily.timer.d/gdprguardian.conf. Listes de paquets
# rafraîchies chaque nuit avant les mises à jour, à heure fixe (heure de Paris). Package lists refreshed every night
# before the updates, at a fixed time (Paris time).
[Timer]
OnCalendar=
OnCalendar=*-*-* 01:15 Europe/Paris
RandomizedDelaySec=0
Persistent=true
