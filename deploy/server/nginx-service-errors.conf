# Gardien RGPD · GDPR Guardian : erreurs que Nginx produit lui-même devant le service, au format du service (corps
# JSON fermé, Retry-After), /etc/nginx/snippets/gdprguardian-service-errors.conf, inclus dans les server de l'API et
# des sites. Errors Nginx produces itself in front of the service, in the service's format (closed JSON body,
# Retry-After). Les 429 et 503 du service lui-même passent tels quels (proxy_intercept_errors reste off).
# The service's own 429 and 503 pass through unchanged (proxy_intercept_errors stays off).
location @gdprguardian_cross_site {
    default_type application/json;
    include /etc/nginx/snippets/gdprguardian-service-headers.conf;
    return 403 '{"error":{"code":"cross_site_request","message":"Requête inter-sites refusée / cross-site request refused"}}';
}
location @gdprguardian_rate_limited {
    default_type application/json;
    include /etc/nginx/snippets/gdprguardian-service-headers.conf;
    add_header Retry-After 1 always;
    return 429 '{"error":{"code":"rate_limited","message":"Trop de requêtes, réessayez après Retry-After / too many requests, retry after Retry-After"}}';
}
location @gdprguardian_too_large {
    default_type application/json;
    include /etc/nginx/snippets/gdprguardian-service-headers.conf;
    return 413 '{"error":{"code":"payload_too_large","message":"Fichier trop volumineux : 50 Mo au plus / file too large: 50 MB at most"}}';
}
location @gdprguardian_unavailable {
    default_type application/json;
    include /etc/nginx/snippets/gdprguardian-service-headers.conf;
    add_header Retry-After 10 always;
    return 503 '{"error":{"code":"service_busy","message":"Capacité temporairement atteinte, réessayez / capacity temporarily reached, retry"}}';
}
