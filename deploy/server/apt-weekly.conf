// Gardien RGPD · GDPR Guardian : passage du samedi, /etc/gdprguardian/apt-weekly.conf, lu par APT_CONFIG en plus
// de /etc/apt/apt.conf.d : la sécurité de chaque nuit, plus les correctifs stables d'Ubuntu (-updates, dont
// docker.io et nginx). Saturday run, read through APT_CONFIG on top of /etc/apt/apt.conf.d: the nightly security
// origins, plus Ubuntu's stable updates (-updates, which include docker.io and nginx).
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}-updates";
};
