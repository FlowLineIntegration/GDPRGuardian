# Gardien RGPD · GDPR Guardian : réglages Nginx communs (contexte http), /etc/nginx/conf.d/00-gdprguardian.conf.
# Shared Nginx settings (http context).

# server_tokens off est posé dans chaque server (et dans nginx-main.conf) : le redire ici ferait un doublon avec le
# nginx.conf d'Ubuntu (« server_tokens build; »), que l'on ne modifie plus. server_tokens off is set in every server
# block (and in nginx-main.conf): repeating it here would clash with Ubuntu's stock nginx.conf, left untouched.

# Cases des tables des map : les noms de la vidéo ($gdprguardian_media, plus bas) dépassent les 64 octets par défaut
# (une ligne de cache), et nginx -t refuserait de construire la table. Avant tout bloc map. Map hash buckets: the video
# names ($gdprguardian_media, below) exceed the default 64 bytes (one cache line), and nginx -t would refuse to build
# the table. Before any map block.
map_hash_bucket_size 128;

# Corps de requête et réponses jamais écrits sur disque : dossiers temporaires en mémoire (/run).
# Request bodies and responses never written to disk: temporary folders in memory (/run).
client_body_temp_path /run/nginx/body 1 2;
proxy_temp_path /run/nginx/proxy;

# Aucun journal d'accès (access_log off ici et sur chaque site). Journal d'erreurs au seul niveau « emerg » (erreurs
# de configuration, qui ne citent jamais d'adresse) : dès « crit », nginx écrit l'adresse complète du client (échec
# de poignée de main TLS, amont injoignable…). Chaque site le redit. Les refus des limites sont notés au niveau
# « info », toujours sous ce seuil. No access log. Error log at "emerg" only (configuration errors, which never
# quote an address): from "crit" on, nginx writes the client's full address. Every site repeats it. Limit refusals
# are logged at "info", always below that threshold.
access_log off;
error_log /var/log/nginx/gdprguardian.error.log emerg;
limit_req_log_level info;
limit_conn_log_level info;

# Adresse tronquée (/24 en IPv4, /48 au plus en IPv6), transmise au démon du site seulement (en-tête X-GG-IP) pour
# compter les visiteurs du jour sans cookie ; il ne la garde pas. $remote_addr est écrit sous forme compressée
# (« 2001:db8::1 ») : la 2e ligne prend trois groupes explicites, la 3e les adresses où « :: » arrive plus tôt,
# sans jamais garder plus de trois groupes. Truncated address (/24 IPv4, at most /48 IPv6), passed to the site
# daemon only (X-GG-IP header) to count today's visitors without a cookie; it never keeps it. $remote_addr comes
# compressed: line 2 takes three explicit groups, line 3 addresses whose "::" comes earlier, never more than three.
map $remote_addr $gdprguardian_ip {
    ~^(?P<a>\d+\.\d+\.\d+)\.\d+$                            $a.0;
    ~^(?P<b>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):        $b::;
    ~^(?P<c>[0-9a-fA-F]*(?::[0-9a-fA-F]+)?)::               $c::;
    default                                                 -;
}

# Clé des limites de débit : l'adresse IPv4 entière, ou le /64 IPv6 écrit sous une forme unique (quatre groupes,
# zéros explicites) quelle que soit la façon dont nginx a compressé l'adresse : un abonné qui tient un /64 en a des
# milliards d'adresses, il n'a qu'une clé. Les cas suivent l'écriture de nginx (ngx_inet6_ntop : « :: » remplace la
# plus longue suite d'au moins deux groupes nuls, la première en cas d'égalité) ; testés par
# tests/server/test_deploy_config.py. Entre guillemets : une accolade de l'expression couperait sinon le bloc.
# Rate-limit key: the full IPv4 address, or the IPv6 /64 written in one single form (four groups, explicit zeros)
# however nginx compressed the address: a subscriber holding a /64 has billions of addresses but one key. The cases
# follow nginx's writing (ngx_inet6_ntop); tested by tests/server/test_deploy_config.py.
map $remote_addr $gdprguardian_limit {
    # IPv4 mappée (écoute double pile seulement) : l'IPv4 / IPv4-mapped (dual-stack listen only): the IPv4.
    "~^::ffff:(?P<m>\d+\.\d+\.\d+\.\d+)$"                                                           $m;
    # Quatre groupes explicites en tête / four explicit leading groups.
    "~^(?P<g>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):"                                 $g;
    # « :: » après trois, deux ou un groupe(s) / "::" after three, two or one group(s).
    "~^(?P<t>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+)::"                                             $t:0;
    "~^(?P<d>[0-9a-fA-F]+:[0-9a-fA-F]+)::"                                                          $d:0:0;
    "~^(?P<u>[0-9a-fA-F]+)::(?P<v>[0-9a-fA-F]+)(?::[0-9a-fA-F]+){4}$"                               $u:0:0:$v;
    "~^(?P<o>[0-9a-fA-F]+)::"                                                                       $o:0:0:0;
    # « :: » en tête / leading "::".
    "~^::(?P<x>[0-9a-fA-F]+):(?P<y>[0-9a-fA-F]+)(?::[0-9a-fA-F]+){4}$"                              0:0:$x:$y;
    "~^::(?P<z>[0-9a-fA-F]+)(?::[0-9a-fA-F]+){4}$"                                                  0:0:0:$z;
    "~^::"                                                                                          0:0:0:0;
    default                                                                                         $remote_addr;
}

# Site : www renvoie à la racine du même domaine / site: www redirects to the bare domain.
map $host $gdprguardian_apex {
    www.gardienrgpd.fr  gardienrgpd.fr;
    default             gdprguardian.com;
}

# Vidéo de lancement des sites, servie par Nginx sous /media/ (nginx-site.conf) depuis /var/www/gdprguardian-media,
# où install.sh site copie les fichiers de video/out (même liste : MEDIA_FILES) : seuls ces noms existent, tout autre
# chemin sous /media/ répond 404 sans atteindre le démon. Launch video of the sites, served by Nginx under /media/ from
# /var/www/gdprguardian-media, where install.sh site copies the video/out files (same list: MEDIA_FILES): only these
# names exist, any other path under /media/ is a 404 that never reaches the daemon.
map $uri $gdprguardian_media {
    default                                             0;
    /media/gardien-rgpd-lancement-fr.mp4                1;
    /media/gardien-rgpd-lancement-fr-poster.png         1;
    /media/gardien-rgpd-lancement-fr-transcript.txt     1;
    /media/gardien-rgpd-lancement-fr-social.mp4         1;
    /media/gdpr-guardian-launch-en.mp4                  1;
    /media/gdpr-guardian-launch-en-poster.png           1;
    /media/gdpr-guardian-launch-en-transcript.txt       1;
    /media/gdpr-guardian-launch-en-social.mp4           1;
}

# Clé constante : plafonds globaux de connexions / constant key: global connection caps.
map $host $gdprguardian_all {
    default all;
}

# Host transmis au service : son propre nom pour api.*, le nom api principal pour le /v1/ des sites (contrat du
# cockpit). Host passed to the service: its own name for api.*, the main api name for the sites' /v1/ (cockpit).
map $host $gdprguardian_service_host {
    api.gardienrgpd.fr  api.gardienrgpd.fr;
    default             api.gdprguardian.com;
}
# HSTS des réponses du service : celle de l'API (1 an) ou celle du site qui les sert (2 ans, comme le démon).
# HSTS of the service's responses: the API's (1 year) or that of the site serving them (2 years, like the daemon).
map $host $gdprguardian_hsts {
    api.gdprguardian.com  "max-age=31536000";
    api.gardienrgpd.fr    "max-age=31536000";
    default               "max-age=63072000";
}

# Requête qu'un navigateur envoie depuis une autre page (Sec-Fetch-Site) : refusée devant le service (403), comme le
# service le fait lui-même ; même origine (cockpit), navigation directe ou client hors navigateur (en-tête absent) :
# admis. A request a browser sends from another page: refused in front of the service (403), as the service does
# itself; same origin (cockpit), direct navigation or a non-browser client (no header): allowed.
map $http_sec_fetch_site $gdprguardian_cross_site {
    default      1;
    ""           0;
    same-origin  0;
    none         0;
}

# Zones en mémoire seulement (nginx.service.d : MemorySwapMax=0, jamais écrites en swap) / zones live in memory only,
# never swapped out.
# Service (API, MCP, /v1/ des sites) : 20 requêtes par seconde et 16 connexions par adresse IPv4 ou /64 IPv6, 48 par
# /24 ou /48 (un /48 compte 65 536 /64), 1 500 en tout. Service: 20 requests per second and 16 connections per IPv4
# address or IPv6 /64, 48 per /24 or /48 (a /48 holds 65,536 /64s), 1,500 in all.
limit_req_zone $gdprguardian_limit zone=gdprguardian_api:10m rate=20r/s;
limit_conn_zone $gdprguardian_limit zone=gdprguardian_api_conn:10m;
limit_conn_zone $gdprguardian_ip zone=gdprguardian_api_net:10m;
limit_conn_zone $gdprguardian_all zone=gdprguardian_api_total:1m;
# Site : 10 requêtes par seconde, 20 connexions par adresse ; flux /api/live : 10 par adresse, 64 par /24 ou /48
# (un /48 compte 65 536 /64), 1 500 en tout. Avec le service : 3 000 connexions de clients, deux connexions chacune
# (client et amont), sous les 8 192 par processus de nginx. Site: 10 requests per second, 20 connections per address;
# /api/live streams: 10 per address, 64 per /24 or /48, 1,500 in all. With the service: 3,000 client connections, two
# connections each (client and upstream), under nginx's 8,192 per worker.
limit_req_zone $gdprguardian_limit zone=gdprguardian_req:10m rate=10r/s;
limit_conn_zone $gdprguardian_limit zone=gdprguardian_conn:10m;
limit_conn_zone $gdprguardian_limit zone=gdprguardian_live:2m;
limit_conn_zone $gdprguardian_ip zone=gdprguardian_live_net:2m;
limit_conn_zone $gdprguardian_all zone=gdprguardian_live_total:1m;
limit_req_status 429;
limit_conn_status 429;

# TLS : profil « intermediate » de Mozilla ; pas de tickets de session (confidentialité persistante).
# TLS: Mozilla "intermediate" profile; no session tickets (forward secrecy).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:gdprguardian_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
