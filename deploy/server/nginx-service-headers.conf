# Gardien RGPD · GDPR Guardian : en-têtes de sécurité des réponses du service, erreurs de Nginx comprises
# (« always »), /etc/nginx/snippets/gdprguardian-service-headers.conf. Inclus au niveau server de l'API, dans le /v1/
# des sites et dans chaque page d'erreur JSON : une directive add_header d'un niveau annule celles du niveau parent.
# Security headers of the service's responses, Nginx's own errors included ("always"). Included at the API's server
# level, in the sites' /v1/ and in every JSON error page: an add_header at one level cancels the parent's.
# Le service pose les mêmes ; ses copies sont masquées (proxy_hide_header) pour qu'aucun n'apparaisse deux fois.
# The service sets the same ones; its copies are hidden (proxy_hide_header) so none appears twice.
add_header Strict-Transport-Security $gdprguardian_hsts always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
# Aucune réponse n'est mise en cache ni partagée (pas de proxy_cache) / no response is ever cached or shared.
add_header Cache-Control no-store always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
