# Gardien RGPD · GDPR Guardian : /etc/systemd/system/apt-daily-upgrade.timer.d/gdprguardian.conf. Sécurité chaque
# nuit vers 2 h (heure de Paris), redémarrage aussitôt si elle l'exige. Le samedi, gdprguardian-weekly-upgrade fait
# ce passage avec les correctifs stables en plus ; le lundi, il a lieu à 1 h 45, avant le redémarrage de 2 h.
# Security every night around 2 am (Paris time), reboot right after when required. On Saturday,
# gdprguardian-weekly-upgrade runs instead, with the stable updates added; on Monday it runs at 1:45, before the
# 2 am reboot.
[Timer]
OnCalendar=
OnCalendar=Tue..Fri,Sun *-*-* 02:00 Europe/Paris
OnCalendar=Mon *-*-* 01:45 Europe/Paris
RandomizedDelaySec=0
Persistent=true
