# Pack Suisse : AVS/AHV, IDE/UID et TVA, téléphones, plaques, codes postaux CH-xxxx / Switzerland pack.
# Niveaux / tiers : A clé forte / strong key ; B clé faible + contexte / weak key + context ; C contexte seul.
# Mots de contexte = preuves du mode auto, donc propres à la Suisse : ni « AVS » seul (auxiliaire de vie scolaire)
# ni « MwSt » ou « UID-Nr. » (Allemagne, Autriche) / context words are auto-mode evidence, hence Swiss-only.
# Motifs terminés par (?![^\W_]) : la regex revient elle-même sur une forme valide / self-delimiting patterns.

[pack]
id = "CH"
name = "Suisse / Schweiz / Svizzera / Svizra"
version = "2026.10.0"
country = "CH"
languages = ["de", "fr", "it", "rm"]
detectors = []

[locale]
phone_codes = ["41"]
tlds = ["ch"]
iban_countries = ["CH"]
languages = ["de", "fr", "it", "rm"]

# « AVS 756 » : le sigle suivi du préfixe suisse du numéro, sans confusion possible avec l'auxiliaire de vie
# scolaire ; sans lui, « AVS 756.9217.0769.85 » seul n'activerait pas le pack. "AVS" followed by the Swiss
# prefix 756 is unambiguous; without it a lone "AVS 756.9217.0769.85" would not activate the pack.
[context.avs]
fr = ["numéro avs", "n° avs", "no avs", "numéro d'assuré avs", "nouveau numéro avs", "avs/ai", "avs 756",
      "avs : 756", "avs: 756", "assurance-vieillesse et survivants", "caisse de compensation avs",
      "caisse cantonale de compensation"]
de = ["ahv", "ahv-nr", "ahv-nummer", "ahvn13", "ahv-versichertennummer", "ahv/iv", "ausgleichskasse",
      "alters- und hinterlassenenversicherung"]
it = ["numero avs", "n. avs", "assicurazione vecchiaia e superstiti"]

[context.uid]
fr = ["numéro ide", "n° ide", "no ide", "feuille officielle suisse du commerce", "fosc"]
de = ["unternehmens-identifikationsnummer", "handelsregisteramt", "schweizerisches handelsamtsblatt", "shab",
      "zefix"]
it = ["numero idi", "n. idi", "registro di commercio", "foglio ufficiale svizzero di commercio", "fusc"]

[context.phone]
fr = ["natel", "numéro de natel", "numéro natel"]
de = ["natel-nr", "natelnummer", "natel-nummer"]

[context.plate]
fr = ["plaques de contrôle", "plaque de contrôle"]
de = ["kontrollschild", "kontrollschilder", "autonummer"]
it = ["targa di controllo", "targhe di controllo"]

# « Office fédéral » seul est exclu : le français l'emploie aussi pour les offices allemands (BAMF, Destatis).
# Bare "office fédéral" is excluded: French also uses it for German federal offices.
[context.country]
fr = ["confédération suisse", "administration fédérale des contributions", "office fédéral des assurances sociales",
      "office fédéral de la santé publique", "office fédéral des routes", "secrétariat d'état aux migrations"]
de = ["schweizerische eidgenossenschaft", "eidgenössisch", "eidgenössische", "eidgenössischen"]
it = ["confederazione svizzera", "amministrazione federale delle contribuzioni"]

# Indices d'entreprise individuelle ; ne comptent pas comme preuve / sole-proprietorship cues, not evidence.
[context.ei]
fr = ["raison individuelle"]
de = ["einzelfirma", "einzelunternehmen", "einzelunternehmung"]
it = ["ditta individuale", "impresa individuale"]

# En-têtes de colonnes (tableurs). En mode auto, le premier pack qui liste un en-tête impose son libellé : ni
# « Sozialversicherungsnummer » (Allemagne), ni « IDE » (infirmier), ni « Kennzeichen » (tout code). « AVS » reste :
# sans lui, une colonne de numéros AVS d'un classeur sans autre indice suisse resterait en clair. Column headers:
# country-specific words only; "AVS" stays, as it is the only cue a Swiss AHV column may carry.
[headers]
CH_AVS = ["avs", "n° avs", "numéro avs", "no avs", "ahv", "ahv-nr", "ahv-nummer", "ahvn13", "numero avs"]
CH_UID = ["n° ide", "numéro ide", "no ide", "numero idi", "n. idi", "unternehmens-identifikationsnummer"]
VAT = ["tva", "n° tva", "numéro tva", "mwst", "mwst-nr", "iva"]
PHONE = ["natel", "téléphone", "tél", "telefon", "telefonnummer", "handy", "telefono", "cellulare"]
PERSON = ["name", "vorname", "nachname", "nome", "cognome"]
ADDRESS = ["adresse", "strasse", "straße", "indirizzo", "domicilio"]
BIRTH_DATE = ["date de naissance", "geburtsdatum", "data di nascita"]
POSTAL_CODE = ["npa", "plz", "nap", "code postal", "postleitzahl", "numero postale"]
PLATE = ["plaques", "plaque de contrôle", "kontrollschild", "autonummer", "targa"]

[labels.CH_AVS]
fr = "AVS"
en = "AHV"
de = "AHV"
it = "AVS"
neutral = "NATIONAL_ID"
aliases = ["AHV", "AHVN13", "NAVS13", "NUMERO_AVS"]

[labels.CH_UID]
fr = "IDE"
en = "UID"
de = "UID"
it = "IDI"
neutral = "COMPANY_ID"
aliases = ["UID_CH", "IDE_CH"]

# --- Personnes / persons ---

# AVS : 756 + 9 chiffres aléatoires + clé EAN-13 ; 756 n'est pas un préfixe GS1 (codes-barres).
# AHVN13: 756 + 9 random digits + EAN-13 key; 756 is not a GS1 (barcode) prefix.
[[recognizer]]
id = "CH_AVS"
entity = "NATIONAL_ID"
label = "CH_AVS"
tier = "A"
score = 0.97
prefilter = "756"
pattern = '756{S}[0-9]{4}{S}[0-9]{4}{S}[0-9]{2}(?![^\W_])'
validator = "ch.avs"
boundary = "alnum"
context = "avs"

# Ancien numéro AVS à 11 chiffres (avant juillet 2008), noté 123.45.678.901 : contexte obligatoire.
# Old 11-digit AHV number (before July 2008), written 123.45.678.901: context required.
[[recognizer]]
id = "CH_AVS_OLD"
entity = "NATIONAL_ID"
label = "CH_AVS"
tier = "C"
prefilter = "digit"
pattern = '[0-9]{3}\.[0-9]{2}\.[0-9]{3}\.[0-9]{3}(?![^\W_])'
boundary = "alnum"
context = "avs"

# Groupement suisse 0xx xxx xx xx (le français groupe par paires) / Swiss grouping (French uses pairs).
[[recognizer]]
id = "CH_PHONE"
entity = "PHONE"
label = "PHONE"
tier = "A"
prefilter = "digit"
pattern = '0[2-9][0-9][ ./-][0-9]{3}[ .-][0-9]{2}[ .-][0-9]{2}(?![^\W_])'
validator = "ch.phone"
boundary = "phone"
context = ["phone", "FR:phone", "INTL:phone"]

[[recognizer]]
id = "CH_PHONE_COMPACT"
entity = "PHONE"
label = "PHONE"
tier = "B"
prefilter = "digit"
pattern = '0[2-9][0-9]{8}(?![^\W_])'
validator = "ch.phone"
boundary = "alnum"
context = ["phone", "FR:phone", "INTL:phone"]

# Plaque : sigle du canton + 1 à 6 chiffres ; « BE », « FR », « LU »… sont ambigus, d'où le contexte. Un groupe
# de 3 chiffres qui suit (« FR 12 345 678 901 ») interdit la coupe. Plate: canton code + 1 to 6 digits; ambiguous
# codes need context, and a following 3-digit group forbids a cut inside a longer number.
[[recognizer]]
id = "CH_PLATE"
entity = "PLATE"
label = "PLATE"
tier = "C"
prefilter = "digit"
pattern = '(?:A[GIR]|B[ELS]|FR|G[ELR]|JU|LU|N[EW]|OW|S[GHOZ]|T[GI]|UR|V[DS]|Z[GH]) ?[1-9][0-9]{0,2}(?: ?[0-9]{3})?(?![^\W_])(?! ?[0-9]{3}(?![0-9]))'
boundary = "alnum"
context = ["plate", "FR:plate", "INTL:plate"]

[[recognizer]]
id = "CH_POSTCODE"
entity = "POSTAL_CODE"
label = "POSTAL_CODE"
tier = "A"
prefilter = "ch-"
pattern = 'CH-[1-9][0-9]{3}(?=\s{1,3}[A-ZÀ-Ý])'
boundary = "alnum"

# --- Entreprises (masquées si entreprise individuelle ou profil strict) / companies ---

# IDE/UID ; le suffixe TVA (MWST, TVA, IVA, TPV), même collé, reste hors de la zone et visible.
# UID; the VAT suffix (MWST, TVA, IVA, TPV), even when glued, stays outside the zone and visible.
[[recognizer]]
id = "CH_UID"
entity = "COMPANY_ID"
label = "CH_UID"
tier = "A"
policy = "company"
prefilter = "che"
pattern = '(?P<v>CHE{S}[0-9]{3}{S}[0-9]{3}{S}[0-9]{3})(?:\s?(?:MWST|TVA|IVA|TPV))?(?![^\W_])'
flags = "i"
group = "v"
validator = "ch.uid"
boundary = "alnum"
context = "uid"
