# Pack Monaco : TVA (régime français, préfixe 000), RCI, téléphones fixes / Monaco pack.
# Aucun algorithme public de numéro personnel national : rien n'est inventé / no public national-ID algorithm.
# Pas de code postal : 98000 couvre toute la Principauté, le masquer ne cache rien et coupe l'adresse en deux.
# No postcode recognizer: 98000 covers the whole principality, so masking it hides nothing and splits addresses.
# Mots de contexte = preuves du mode auto, donc propres à Monaco : ni « RCI » seul (RCI Banque) ni « Monaco »
# seul (Grand Prix) / context words are auto-mode evidence, hence Monaco-only.
# Motifs terminés par (?![^\W_]) : la regex revient elle-même sur une forme valide / self-delimiting patterns.

[pack]
id = "MC"
name = "Monaco"
version = "2026.10.0"
country = "MC"
languages = ["fr"]
detectors = []

[locale]
phone_codes = ["377"]
tlds = ["mc"]
iban_countries = ["MC"]
languages = ["fr"]

[context.rci]
fr = ["répertoire du commerce et de l'industrie", "n° rci", "numéro rci", "no rci", "r.c.i.",
      "immatriculée au rci", "immatriculé au rci", "inscrite au rci", "inscrit au rci"]

[context.country]
fr = ["principauté de monaco", "monégasque", "monégasques", "gouvernement princier", "ordonnance souveraine",
      "caisses sociales de monaco", "direction des services fiscaux de monaco", "imsee"]

# Indices de commerçant personne physique ; ne comptent pas comme preuve / sole-trader cues, not evidence.
[context.ei]
fr = ["commerçant personne physique", "personne physique commerçante"]

[headers]
MC_RCI = ["rci", "n° rci", "numéro rci"]
VAT = ["tva", "n° tva", "numéro de tva"]

[labels.MC_RCI]
fr = "RCI"
en = "RCI"
neutral = "COMPANY_ID"
aliases = ["RCI_MONACO"]

# Fixe 9x xx xx xx, mobile 4x xx xx xx : 8 chiffres sans préfixe, ambigus sans contexte.
# Les mobiles 06 xx xx xx xx ont la forme française : le pack FR les détecte.
# Landline 9x and mobile 4x: 8 digits, no prefix, ambiguous without context. 06… mobiles look French.
[[recognizer]]
id = "MC_PHONE"
entity = "PHONE"
label = "PHONE"
tier = "B"
prefilter = "digit"
pattern = '(?:9[2-9]|4[4-6])(?:{S}[0-9]{2}){3}(?![^\W_])'
validator = "mc.phone"
boundary = "phone"
context = ["FR:phone", "INTL:phone"]

# RCI : année (2 chiffres), type (S société, C ou SC civile, P personne physique), rang (5 chiffres),
# d'après https://org-id.guide/list/MC-RCI et https://docs.topograph.co/essentials/monaco.
# RCI d'une personne physique (type P) : toujours masqué / natural-person RCI (type P): always masked.
[[recognizer]]
id = "MC_RCI_PERSON"
entity = "COMPANY_ID"
label = "MC_RCI"
tier = "A"
prefilter = ["rci", "r.c.i", "r. c. i", "repertoire du commerce"]
pattern = '''(?:R\.?\s?C\.?\s?I\.?|[Rr][ée]pertoire\s{1,3}du\s{1,3}[Cc]ommerce\s{1,3}et\s{1,3}de\s{1,3}l'\s{0,2}[Ii]ndustrie)(?:\s{1,3}(?:de\s{1,3})?Monaco)?[\s,:]{0,4}(?:sous\s{1,3}le\s{1,3})?(?:(?:[Nn][°º]|[Nn]o\.?|[Nn]um[ée]ro)\s{0,3}:?\s{0,3})?(?P<v>[0-9]{2} ?P ?[0-9]{5})(?![^\W_])'''
group = "v"
validator = "mc.rci"
boundary = "alnum"

# --- Entreprises (masquées si personne physique ou profil strict) / companies ---

[[recognizer]]
id = "MC_RCI"
entity = "COMPANY_ID"
label = "MC_RCI"
tier = "A"
policy = "company"
prefilter = ["rci", "r.c.i", "r. c. i", "repertoire du commerce"]
pattern = '''(?:R\.?\s?C\.?\s?I\.?|[Rr][ée]pertoire\s{1,3}du\s{1,3}[Cc]ommerce\s{1,3}et\s{1,3}de\s{1,3}l'\s{0,2}[Ii]ndustrie)(?:\s{1,3}(?:de\s{1,3})?Monaco)?[\s,:]{0,4}(?:sous\s{1,3}le\s{1,3})?(?:(?:[Nn][°º]|[Nn]o\.?|[Nn]um[ée]ro)\s{0,3}:?\s{0,3})?(?P<v>[0-9]{2} ?(?:SC|[CS]) ?[0-9]{5})(?![^\W_])'''
group = "v"
validator = "mc.rci"
boundary = "alnum"

# TVA : numéro français dont le corps commence par 000 / French-scheme VAT whose body starts with 000.
[[recognizer]]
id = "MC_TVA"
entity = "VAT"
label = "VAT"
tier = "A"
policy = "company"
prefilter = "digit"
pattern = 'FR{S}[0-9A-HJ-NP-Z]{2}{S}0{S}0{S}0(?:{S}[0-9]){6}(?![^\W_])'
flags = "i"
validator = "mc.tva"
boundary = "alnum"
