# Pack international, toujours actif / international pack, always on.
# Motifs : chaînes littérales TOML ('…'), macros {S} = séparateur optionnel, {SEP} = séparateur.
# Patterns: TOML literal strings, macros {S} = optional separator, {SEP} = separator.

[pack]
id = "INTL"
name = "International"
version = "2026.10.0"
always_on = true
languages = ["fr", "en", "de", "es", "it", "nl", "pt"]
detectors = [
    "gdprguardian.detectors.intl:EmailDetector",
    "gdprguardian.detectors.intl:IbanDetector",
    "gdprguardian.detectors.intl:MrzDetector",
    "gdprguardian.detectors.intl:InternationalPhoneDetector",
]

[context.email]
fr = ["email", "e-mail", "mail", "courriel", "adresse électronique", "contact"]
en = ["email", "e-mail", "mail", "contact"]

# Mots génériques, communs à plusieurs pays : ils vivent ici, car les mots d'un pack pays comptent comme
# preuve de pays en mode auto. Generic words shared by several countries live here: a country pack's
# words count as country evidence in auto mode.
[context.phone]
fr = ["tél", "tel", "téléphone", "portable", "mobile", "gsm", "fax"]
en = ["phone", "mobile", "cell"]
de = ["telefon", "handy", "mobil"]
es = ["teléfono", "móvil"]
it = ["telefono", "cellulare"]
nl = ["telefoon", "gsm", "mobiel"]
pt = ["telefone", "telemóvel", "celular"]

[context.id_card]
fr = ["carte d'identité", "pièce d'identité"]
en = ["identity card", "id card"]
de = ["identitätskarte", "personalausweis"]
nl = ["identiteitskaart"]

[context.plate]
fr = ["plaque", "immatriculation"]
en = ["license plate", "registration number"]
de = ["kennzeichen", "kontrollschild"]
nl = ["nummerplaat", "kenteken"]

[context.iban]
fr = ["iban", "rib", "coordonnées bancaires", "compte", "relevé d'identité bancaire", "virement", "prélèvement"]
en = ["iban", "bank account", "account number", "bank details"]
de = ["iban", "kontonummer", "bankverbindung"]
es = ["iban", "cuenta bancaria"]
it = ["iban", "conto corrente"]
nl = ["iban", "rekeningnummer", "bankrekening"]
pt = ["iban", "conta bancária", "nib"]

[context.card]
fr = ["carte bancaire", "carte de crédit", "cb", "visa", "mastercard", "amex", "numéro de carte", "paiement"]
en = ["credit card", "card number", "visa", "mastercard", "amex", "payment"]

[context.imei]
fr = ["imei", "numéro de série", "téléphone portable"]
en = ["imei", "serial number"]

[context.dob]
fr = ["né le", "née le", "nés le", "né(e) le", "date de naissance", "ddn", "naissance", "date naiss",
      "vu le jour", "voit le jour", "venu au monde", "venue au monde"]
en = ["born", "date of birth", "dob", "birth date", "birthday"]
de = ["geboren", "geburtsdatum", "geb."]
es = ["nacido", "nacida", "fecha de nacimiento"]
it = ["nato", "nata", "data di nascita"]
nl = ["geboren op", "geboortedatum"]
pt = ["data de nascimento", "nascido em", "nascida em"]

# Veto : placés entre « né le » et une date, ces mots en font une autre date (réunion, facture…).
# Veto: between "born on" and a date, these words make it another kind of date (meeting, invoice…).
# Événements de vie (mariage, décès…) exclus : ces dates restent masquées / life events stay masked.
[context.other_date]
fr = ["réunion", "rendez-vous", "rdv", "facture", "devis", "commande", "livraison", "échéance", "paiement",
      "virement", "prélèvement", "émis le", "émise le", "signé le", "signée le", "fait le", "daté du", "datée du",
      "en date du", "courrier du", "lettre du", "mail du", "courriel du", "message du", "envoyé le", "envoyée le",
      "reçu le", "reçue le", "valable jusqu'au", "séance", "comité", "publié le", "mise à jour",
      # Actes et soins datés (tests terrain du 26/10) / dated acts and care (field test, 26 October).
      "désigné le", "désignée le", "ordonné le", "ordonnée le", "décidé le", "décidée le", "prononcé le",
      "prononcée le", "rendu le", "rendue le", "conclu le", "conclue le", "hospitalisé le", "hospitalisée le",
      "hospitalisation", "admis le", "admise le", "admission", "opéré le", "opérée le", "consultation",
      "consulté le", "consultée le", "embauché le", "embauchée le", "embauche", "engagé le",
      "engagée le", "licencié le", "licenciée le", "licenciement", "convoqué le", "convoquée le", "convocation",
      "entretien", "audience", "jugement", "arrêt du", "ordonnance du", "déposé le", "déposée le", "saisi le",
      "saisie le", "notifié le", "notifiée le", "intervenu le", "intervenue le", "survenu le", "survenue le"]
en = ["meeting", "appointment", "invoice", "quote", "order", "delivery", "due date", "payment", "issued on",
      "signed on", "dated", "sent on", "received on", "valid until", "published on", "updated on"]

[context.secret]
fr = ["mot de passe", "mdp", "token", "jeton", "clé api", "secret"]
en = ["password", "passwd", "token", "api key", "secret"]

[[recognizer]]
id = "EMAIL_OBFUSCATED"
entity = "EMAIL"
label = "EMAIL"
tier = "A"
flags = "i"
prefilter = ["[at]", "(at)", "{at}", "arobase", "&#64;", "%40"]
pattern = '[\w.%+\-]{1,64}\s?(?:\[at\]|\(at\)|\{at\}|\[arobase\]|\(arobase\)|\sarobase\s|&#64;|%40)\s?[\w\-]{1,63}(?:\s?(?:\[dot\]|\(dot\)|\{dot\}|\[point\]|\(point\)|\.)\s?[\w\-]{1,63}){1,4}'
boundary = "word"

# « @ » réel, domaine déguisé (« jean@exemple [dot] fr », « jean@exemple(point)fr ») : au moins un point déguisé.
# Real "@", disguised domain dots: at least one disguised dot.
[[recognizer]]
id = "EMAIL_OBFUSCATED_DOT"
entity = "EMAIL"
label = "EMAIL"
tier = "A"
flags = "i"
prefilter = ["[dot]", "(dot)", "{dot}", "[point]", "(point)"]
pattern = '[\w.%+\-]{1,64}@[\w\-]{1,63}(?:\.[\w\-]{1,63})*(?:\s?(?:\[dot\]|\(dot\)|\{dot\}|\[point\]|\(point\))\s?[\w\-]{1,63}(?:\.[\w\-]{1,63})*){1,4}'
boundary = "word"

[[recognizer]]
id = "URL_PERSONAL"
entity = "URL"
label = "URL"
tier = "A"
flags = "i"
prefilter = ["linkedin.com", "facebook.com", "fb.com", "instagram.com", "twitter.com", "x.com/", "github.com",
             "gitlab.com", "tiktok.com", "youtube.com", "medium.com", "t.me/", "wa.me/", "viadeo.com"]
pattern = '(?:https?://)?(?:www\.)?(?:linkedin\.com/in|facebook\.com|fb\.com|instagram\.com|twitter\.com|x\.com|github\.com|gitlab\.com|tiktok\.com/@|youtube\.com/@|medium\.com/@|t\.me|wa\.me|viadeo\.com/fr/profile)/[\w.\-%@]{2,100}/?'
boundary = "word"

[[recognizer]]
id = "IPV4"
entity = "IP"
label = "IP"
tier = "A"
prefilter = "digit"
pattern = '(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}'
validator = "intl.ipv4"
boundary = "ip"

[[recognizer]]
id = "IPV6"
entity = "IP"
label = "IP"
tier = "A"
prefilter = ":"
pattern = '(?:[0-9A-Fa-f]{1,4}:){2,7}[0-9A-Fa-f]{1,4}|(?:[0-9A-Fa-f]{1,4}:){1,7}:(?:[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{1,4}){0,5})?|::(?:[0-9A-Fa-f]{1,4}:){0,5}[0-9A-Fa-f]{1,4}'
validator = "intl.ipv6"
boundary = "hex"

[[recognizer]]
id = "MAC"
entity = "MAC"
label = "MAC"
tier = "A"
pattern = '[0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5}|[0-9A-Fa-f]{2}(?:-[0-9A-Fa-f]{2}){5}'
validator = "intl.mac"
boundary = "hex"

[[recognizer]]
id = "CARD"
entity = "CARD"
label = "CARD"
tier = "A"
score = 0.9
prefilter = "digit"
pattern = '[2-6][0-9]{3}(?:[ \-]?[0-9]{4}){2}[ \-]?[0-9]{1,4}(?:[ \-]?[0-9]{1,3})?|3[47][0-9]{2}[ \-]?[0-9]{6}[ \-]?[0-9]{5}'
validator = "intl.card"
boundary = "alnum"
context = "card"
invalid = "context"

# Carte regroupée librement (« 53715 8592 97 2274 2 ») : 16 chiffres, clé de Luhn exigée (comme `CARD`), toute la
# suite de groupes (borne « group »). Freely regrouped card: 16 digits, Luhn key required, the whole run of groups.
[[recognizer]]
id = "CARD_REGROUPED"
entity = "CARD"
label = "CARD"
tier = "A"
score = 0.9
prefilter = "digit"
pattern = '[2-6](?:[ ./\-]?[0-9]){15}'
validator = "intl.card"
boundary = "group"
context = "card"

# Format imprimé 4-4-4-4 : la forme suffit, Luhn ne fait que moduler le score (fautes, OCR).
# Printed 4-4-4-4 layout: the shape is enough, Luhn only adjusts the score (typos, OCR).
[[recognizer]]
id = "CARD_GROUPED"
entity = "CARD"
label = "CARD"
tier = "L"
score = 0.9
prefilter = "digit"
pattern = '[2-6][0-9]{3}(?: [0-9]{4}){3}|[2-6][0-9]{3}(?:-[0-9]{4}){3}'
validator = "intl.card"
boundary = "alnum"

# 14 chiffres : même forme qu'un SIRET, mot-clé de carte exigé / a SIRET's shape, card keyword required.
[[recognizer]]
id = "CARD_14"
entity = "CARD"
label = "CARD"
tier = "B"
score = 0.9
prefilter = "digit"
pattern = '3[0689][0-9]{2}[ \-]?[0-9]{6}[ \-]?[0-9]{4}|3[0689][0-9]{2}(?:[ \-]?[0-9]{4}){2}[ \-]?[0-9]{2}'
validator = "intl.card14"
boundary = "alnum"
context = "card"
invalid = "context"
window = [80, 20]

[[recognizer]]
id = "IMEI"
entity = "IMEI"
label = "IMEI"
tier = "B"
prefilter = "digit"
pattern = '[0-9]{2}[ \-]?[0-9]{6}[ \-]?[0-9]{6}[ \-]?[0-9]'
validator = "intl.imei"
boundary = "alnum"
context = "imei"
invalid = "context"

[[recognizer]]
id = "BTC"
entity = "CRYPTO"
label = "CRYPTO"
tier = "A"
pattern = '(?:bc1|tb1)[ac-hj-np-z02-9]{11,71}|[13][a-km-zA-HJ-NP-Z1-9]{25,34}'
validator = "intl.btc"
boundary = "alnum"

[[recognizer]]
id = "ETH"
entity = "CRYPTO"
label = "CRYPTO"
tier = "A"
prefilter = "0x"
pattern = '0x[0-9a-fA-F]{40}'
validator = "intl.eth"
boundary = "alnum"

[[recognizer]]
id = "BIRTH_DATE"
entity = "BIRTH_DATE"
label = "BIRTH_DATE"
tier = "C"
prefilter = "digit"
pattern = '(?:0?[1-9]|[12][0-9]|3[01])[/.\-](?:0?[1-9]|1[0-2])[/.\-](?:19|20)[0-9]{2}|(?:19|20)[0-9]{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])'
validator = "intl.calendar_date"
boundary = "alnum"
context = "dob"
veto = "other_date"
window = [80, 4]

# Mois en anglais (« 6 October 1950 », « October 6, 1950 ») / English month names.
[[recognizer]]
id = "BIRTH_DATE_WORDS_EN"
entity = "BIRTH_DATE"
label = "BIRTH_DATE"
tier = "C"
flags = "i"
prefilter = "digit"
pattern = '(?:0?[1-9]|[12][0-9]|3[01])(?:st|nd|rd|th)?\s{1,3}(?:of\s{1,3})?(?:january|february|march|april|may|june|july|august|september|october|november|december)\.?,?\s{1,3}(?:18|19|20)[0-9]{2}|(?:january|february|march|april|may|june|july|august|september|october|november|december)\s{1,3}(?:0?[1-9]|[12][0-9]|3[01])(?:st|nd|rd|th)?,?\s{1,3}(?:18|19|20)[0-9]{2}'
boundary = "alnum"
context = "dob"
veto = "other_date"
window = [80, 4]

# --- Secrets (jamais conservés, toujours remplacés / never kept, always replaced) ---

[[recognizer]]
id = "SECRET_AWS"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = ["akia", "asia", "abia", "acca", "a3t"]
pattern = '(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}'
boundary = "alnum"

[[recognizer]]
id = "SECRET_GITHUB"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]
pattern = 'gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{60,255}'
boundary = "word"

[[recognizer]]
id = "SECRET_GITLAB"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = "glpat-"
pattern = 'glpat-[A-Za-z0-9_\-]{20,64}'
boundary = "word"

[[recognizer]]
id = "SECRET_SLACK"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = "xox"
pattern = 'xox[abposr]-[0-9A-Za-z\-]{10,250}'
boundary = "word"

[[recognizer]]
id = "SECRET_STRIPE"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]
pattern = '(?:sk|rk)_(?:live|test)_[0-9A-Za-z]{16,99}'
boundary = "word"

[[recognizer]]
id = "SECRET_GOOGLE"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = "aiza"
pattern = 'AIza[0-9A-Za-z_\-]{35}'
boundary = "word"

[[recognizer]]
id = "SECRET_LLM_KEY"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = "sk-"
pattern = 'sk-(?:ant-|proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{20,200}'
boundary = "word"

[[recognizer]]
id = "SECRET_JWT"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = "eyj"
pattern = 'eyJ[A-Za-z0-9_\-]{10,2000}\.eyJ[A-Za-z0-9_\-]{10,4000}\.[A-Za-z0-9_\-]{10,2000}'
boundary = "word"

[[recognizer]]
id = "SECRET_PRIVATE_KEY"
entity = "SECRET"
label = "SECRET"
tier = "A"
prefilter = "private key"
pattern = '-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----[\s\S]{20,12000}?-----END (?:[A-Z]+ )?PRIVATE KEY-----'
boundary = "none"

[[recognizer]]
id = "SECRET_PASSWORD"
entity = "SECRET"
label = "SECRET"
tier = "A"
flags = "i"
prefilter = ["pass", "pwd", "mot de passe", "mdp"]
pattern = '''(?:password|passwd|pwd|mot de passe|mdp)\s{0,3}[:=]\s{0,3}(?P<v>[^\s"'<>]{4,128})'''
group = "v"
boundary = "none"

[[recognizer]]
id = "SECRET_BEARER"
entity = "SECRET"
label = "SECRET"
tier = "A"
flags = "i"
prefilter = "bearer"
pattern = 'bearer\s{1,3}(?P<v>[A-Za-z0-9\-._~+/]{20,500}=*)'
group = "v"
boundary = "none"
